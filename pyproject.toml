[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastfort"
dynamic = ["version"]
description = "Batteries-included authentication and admin framework for FastAPI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Matnazar", email = "matnazarmatnazarov3@gmail.com" }]
maintainers = [{ name = "Matnazar", email = "matnazarmatnazarov3@gmail.com" }]
keywords = [
    "fastapi",
    "admin",
    "admin-panel",
    "authentication",
    "authorization",
    "jwt",
    "orm",
    "sqlalchemy",
    "tortoise-orm",
    "starlette",
    "asgi",
    "async",
    "crud",
    "dashboard",
    "i18n",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    # No "License ::" classifier: the SPDX `license` field above supersedes it
    # (PEP 639), and PyPI rejects a distribution that carries both.
    "Natural Language :: Arabic",
    "Natural Language :: Chinese (Simplified)",
    "Natural Language :: English",
    "Natural Language :: French",
    "Natural Language :: German",
    "Natural Language :: Japanese",
    "Natural Language :: Korean",
    "Natural Language :: Russian",
    "Natural Language :: Spanish",
    "Natural Language :: Turkish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Database :: Front-Ends",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]

dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "jinja2>=3.1.4",
    "itsdangerous>=2.2",
    "pyjwt>=2.9",
    "pwdlib[argon2]>=0.2.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
sqlalchemy = ["sqlalchemy>=2.0.30", "greenlet>=3.0"]
tortoise = ["tortoise-orm>=0.21"]
sqlite = ["aiosqlite>=0.20"]
postgres = ["asyncpg>=0.29"]
mysql = ["aiomysql>=0.3.2"]
cli = ["typer>=0.12", "rich>=13.7"]
# Brotli for the admin's own CSS and JavaScript. Optional because a project
# behind a proxy that already compresses needs nothing here, and because a
# missing package should mean "gzip, then" rather than a failed import.
compression = ["brotli>=1.1"]
all = [
    "fastfort[sqlalchemy]",
    "fastfort[sqlite]",
    "fastfort[postgres]",
    "fastfort[mysql]",
    "fastfort[cli]",
    "fastfort[compression]",
]

[project.urls]
Homepage = "https://github.com/Matnazar-Matnazarov/fastfort"
Documentation = "https://github.com/Matnazar-Matnazarov/fastfort#readme"
Repository = "https://github.com/Matnazar-Matnazarov/fastfort"
Changelog = "https://github.com/Matnazar-Matnazarov/fastfort/blob/main/CHANGELOG.md"
Issues = "https://github.com/Matnazar-Matnazarov/fastfort/issues"

[project.scripts]
fastfort = "fastfort.cli.main:main"

[tool.hatch.version]
path = "fastfort/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["fastfort"]
# Stylesheets, templates and JavaScript are data files, so they need naming
# explicitly or the wheel ships a package with no interface.
artifacts = [
    "fastfort/ui/static/**",
    "fastfort/ui/templates/**",
    "fastfort/i18n/locale/**",
]

[tool.hatch.build.targets.sdist]
include = ["/fastfort", "/tests", "/README.md", "/LICENSE", "/CHANGELOG.md"]

# ---------------------------------------------------------------------------
# Dependency groups (uv) — not shipped to PyPI
# ---------------------------------------------------------------------------
[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-randomly>=3.15",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "uvicorn>=0.30",
    "geoalchemy2>=0.20.0",
    "asyncpg>=0.31.0",
    "openpyxl>=3.1.5",
    "pgvector>=0.3",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["fastfort", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T20",    # flake8-print
    "PT",     # flake8-pytest-style
    "RET",    # flake8-return
    "SIM",    # flake8-simplify
    "PTH",    # flake8-use-pathlib
    "RUF",    # ruff-specific
    "S",      # flake8-bandit
    "A",      # flake8-builtins
    "ASYNC",  # flake8-async
]
ignore = [
    "S101",   # assert -- required in tests
    "B008",   # FastAPI uses Depends() as a default argument
    # The admin renders typographic characters on purpose: an en dash in a range,
    # an ellipsis in a placeholder. Flagging them as "ambiguous" is noise here.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20"]
"examples/**" = ["T20"]
# Diagnostic scripts report to the terminal; printing is the point.
"scripts/**" = ["T20"]
# N818: `ObjectNotFound`, `PermissionDenied` and `ImproperlyConfigured` are names
# Django users already know. Appending "Error" would only hurt the developer
# experience, so the deviation is deliberate.
"fastfort/core/exceptions.py" = ["N818"]
# LoginRequired is a control-flow signal named for what it means, the way
# Starlette names HTTPException. "LoginRequiredError" reads worse.
"fastfort/admin/security.py" = ["N818"]

[tool.ruff.lint.isort]
known-first-party = ["fastfort"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_no_return = true
disallow_any_generics = true
show_error_codes = true
pretty = true
files = ["fastfort"]

[[tool.mypy.overrides]]
module = ["tests.*", "examples.*"]
ignore_errors = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "sqlite: requires SQLite",
    "postgres: requires a PostgreSQL server",
    "mysql: requires a MySQL server",
    "slow: slow running test",
]
filterwarnings = ["error"]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["fastfort"]
branch = true
omit = ["fastfort/cli/*"]

[tool.coverage.report]
precision = 1
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "\\.\\.\\.",
]
