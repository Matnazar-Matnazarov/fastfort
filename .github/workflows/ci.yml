name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  # -------------------------------------------------------------------------
  # Linting, typing and architecture rules -- the fastest gate, so it runs first.
  # -------------------------------------------------------------------------
  quality:
    name: Lint · types · architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --all-extras

      - name: ruff check
        run: uv run ruff check --output-format=github .

      - name: ruff format
        run: uv run ruff format --check .

      - name: mypy --strict
        run: uv run mypy fastfort

      - name: Architecture rules
        run: uv run pytest tests/test_architecture.py -q

  # -------------------------------------------------------------------------
  # SQLite across every supported Python version. Needs no external services.
  # -------------------------------------------------------------------------
  test-sqlite:
    name: Tests · SQLite · py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - run: uv sync --all-extras

      - run: uv run pytest --db=sqlite -q --cov --cov-report=xml

      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: coverage-sqlite
          path: coverage.xml

  # -------------------------------------------------------------------------
  # PostgreSQL and MySQL, exercised against real servers.
  # -------------------------------------------------------------------------
  test-postgres:
    name: Tests · PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fastfort
          POSTGRES_PASSWORD: fastfort
          POSTGRES_DB: fastfort_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fastfort"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --all-extras
      - run: uv run pytest --db=postgres -q
        env:
          FASTFORT_TEST_POSTGRES_URL: postgresql+asyncpg://fastfort:fastfort@localhost:5432/fastfort_test

  test-mysql:
    name: Tests · MySQL 8.4
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: fastfort
          MYSQL_USER: fastfort
          MYSQL_PASSWORD: fastfort
          MYSQL_DATABASE: fastfort_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ufastfort -pfastfort"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --all-extras
      - run: uv run pytest --db=mysql -q
        env:
          FASTFORT_TEST_MYSQL_URL: mysql+aiomysql://fastfort:fastfort@127.0.0.1:3306/fastfort_test

  # -------------------------------------------------------------------------
  # Known vulnerabilities in the dependency tree.
  # -------------------------------------------------------------------------
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras

      # The audit runs against the locked third-party dependencies only.
      # `--no-emit-project` leaves fastfort itself out: it is not published yet,
      # and pip-audit treats a package it cannot find on PyPI as a hard failure.
      - name: Export locked dependencies
        run: >-
          uv export --all-extras --no-emit-project --no-hashes
          --format requirements-txt > requirements-audit.txt

      - name: Audit dependencies
        run: uv run --with pip-audit pip-audit --strict --requirement requirements-audit.txt

  # -------------------------------------------------------------------------
  # The distributions, checked the same way the release workflow checks them --
  # so a packaging mistake is a red pull request rather than a bad version on
  # PyPI that can never be replaced.
  # -------------------------------------------------------------------------
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build wheel and sdist
        run: uv build

      - name: Check the metadata renders on PyPI
        run: uv run --with twine python -m twine check --strict dist/*

      # This package is mostly data: templates, seven stylesheets, two scripts,
      # eleven catalogues and an icon set. They are listed in `pyproject.toml`
      # rather than found automatically, so a wheel that builds and imports
      # cleanly can still be one whose admin renders nothing -- which is exactly
      # what happens when a new directory is added and that list is not.
      - name: The wheel carries its data files
        run: |
          python - <<'PY'
          import sys, zipfile
          from pathlib import Path

          wheel = next(Path("dist").glob("*.whl"))
          names = zipfile.ZipFile(wheel).namelist()

          required = {
              "templates": "fastfort/ui/templates/base.html",
              "stylesheets": "fastfort/ui/static/css/01-tokens.css",
              "scripts": "fastfort/ui/static/js/fastfort.js",
              "boot script": "fastfort/ui/static/js/boot.js",
              "favicon": "fastfort/ui/static/favicon.svg",
              "typing marker": "fastfort/py.typed",
          }
          missing = {what: path for what, path in required.items() if path not in names}

          catalogues = [n for n in names if n.startswith("fastfort/i18n/locale/")]
          if len(catalogues) < 10:
              missing["catalogues"] = f"only {len(catalogues)} found"

          for what, detail in missing.items():
              print(f"::error::the wheel is missing its {what} ({detail})")
          sys.exit(1 if missing else 0)
          PY

      - name: Install the wheel into a clean environment
        run: uv run --isolated --no-project --with dist/*.whl python -c "import fastfort; print(fastfort.__version__)"

      # A wheel built *from the sdist*, which is what a downstream packager and
      # `pip install --no-binary` actually do. An sdist that is missing a file
      # the build needs passes every check above and fails only there.
      - name: The sdist builds a wheel
        run: uv build --wheel --out-dir rebuilt "$(ls dist/*.tar.gz)"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
